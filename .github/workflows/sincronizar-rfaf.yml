name: Sincronizar con la RFAF

# Trae calendarios, horarios, resultados y clasificaciones de los equipos del
# club y los commitea. Nadie tiene que teclear nada.
#
# El horario sigue a cuándo se juega de verdad, no a un reparto uniforme:
# la cantera juega el SÁBADO (Alevín A, Cadete, Infantil B) y el primer equipo,
# el Juvenil y el Infantil A juegan el DOMINGO. Entre semana casi no hay nada,
# salvo alguna eliminatoria de copa del primer equipo.
#
# Y hay que ir con tiento: la RFAF corta el acceso pasadas unas 40 peticiones
# seguidas. Por eso solo se pide lo que puede haber cambiado y una pasada que
# no encuentra nada nuevo apenas gasta.

on:
  schedule:
    # Horas UTC. En horario de verano son +2 y en invierno +1 respecto a España.

    # Cada mañana: cambios de calendario y horarios asignados durante la semana.
    - cron: "10 5 * * *"

    # Sábado por la tarde y noche: resultados de la cantera.
    - cron: "30 15,17,19,21 * * 6"

    # Domingo: resultados del primer equipo, Juvenil e Infantil A. Se alarga
    # hasta la noche porque los partidos del domingo empiezan más tarde.
    - cron: "30 13,15,17,19,21 * * 0"

    # Lunes a primera hora: recoge las actas que se cierran tarde el domingo.
    - cron: "0 7 * * 1"

    # Miércoles por la noche: alguna eliminatoria de copa entre semana.
    - cron: "0 21 * * 3"

  workflow_dispatch:
    inputs:
      completo:
        description: "Recargar todas las jornadas, no solo las recientes"
        type: boolean
        default: false

# Evita que dos pasadas se pisen y agoten el cupo entre ellas
concurrency:
  group: sincronizar-rfaf
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Sincronizar
        run: |
          node scripts/rfaf/sincronizar.mjs \
            ${{ inputs.completo && '--completo' || '' }} \
            | tee salida.txt

      - name: Resumen
        if: always()
        run: |
          {
            echo '### Sincronización con la RFAF'
            echo '```'
            cat salida.txt 2>/dev/null || echo 'sin salida'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar cambios
        run: |
          if [ -z "$(git status --porcelain src/data/rfaf)" ]; then
            echo "Sin cambios en los datos de competición."
            exit 0
          fi
          git config user.name  "Sincronización RFAF"
          git config user.email "actions@github.com"
          git add src/data/rfaf
          git commit -m "Datos de competición actualizados desde la RFAF"
          git push
