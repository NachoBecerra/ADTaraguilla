name: Sincronizar con la RFAF

# Trae calendarios, horarios, resultados y clasificaciones de los equipos del
# club y los commitea. Nadie tiene que teclear nada.
#
# El horario lo marca cómo funciona la competición de verdad:
#
#  - Los HORARIOS de los partidos se asignan durante la semana, sobre todo de
#    martes a jueves. Por eso hay tres pasadas diarias de lunes a jueves.
#  - Se juega VIERNES tarde, SÁBADO todo el día (el primero a las 10:00) y
#    algún DOMINGO, casi siempre el primer equipo.
#  - El resultado no aparece al pitar el final, sino cuando el árbitro cierra
#    el acta: sobre hora y media o dos después del saque.
#
# Frecuencia y cupo de la RFAF: el portal corta pasadas ~40 peticiones
# seguidas, así que lo que importa no es cuántas pasadas hay, sino lo que
# cuesta cada una. Una pasada que no encuentra nada pendiente gasta 5 o 6
# peticiones; solo se consultan los equipos cuyo partido YA ha terminado y
# sigue sin resultado. Por eso se puede mirar cada media hora un sábado sin
# acercarse al límite.
#
# Aviso: GitHub no garantiza la puntualidad de estos disparos. Suelen llegar
# con unos minutos de retraso y, si su cola va cargada, alguno puede saltarse.
# Por eso los minutos no son en punto: a esa hora se programa medio mundo.

on:
  schedule:
    # Horas UTC. En horario de verano son +2 y en invierno +1 respecto a España.
    # Los comentarios van en hora española de verano.

    # Lunes a jueves: cada dos horas, de 09:00 a 23:00.
    #
    # Antes eran tres pasadas (10:00, 15:00 y 20:00) y se quedaba un hueco de
    # catorce horas entre la última y la primera del día siguiente. La RFAF
    # asigna los horarios durante la semana y a veces de noche: un horario
    # publicado a las nueve de la tarde no se veía hasta la mañana siguiente.
    - cron: "7 7-21/2 * * 1-4"

    # Viernes: revisión a las 10:00 y, desde las 16:00, cada media hora hasta
    # medianoche, que es cuando empiezan a llegar resultados.
    - cron: "7 8 * * 5"
    - cron: "7,37 14-22 * * 5"

    # Sábado: día grande. Revisión a las 9:00 y cada media hora de 11:00 a
    # medianoche; el primer partido es a las 10:00 y su acta cae sobre las 12.
    - cron: "7 7 * * 6"
    - cron: "7,37 9-22 * * 6"

    # Domingo: igual que el sábado. El calendario de esta temporada dice que
    # juegan tres equipos —Infantil A, Juvenil y el primer equipo—, 89 partidos
    # en total frente a los 134 del sábado. Con las cuatro pasadas de antes, un
    # resultado de media tarde tardaba horas en aparecer.
    - cron: "7 7 * * 0"
    - cron: "7,37 9-22 * * 0"

  workflow_dispatch:
    inputs:
      completo:
        description: "Recargar todas las jornadas, no solo las recientes"
        type: boolean
        default: false

# Evita que dos pasadas se pisen y agoten el cupo entre ellas
concurrency:
  group: sincronizar-rfaf
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Sincronizar
        # Los avisos al móvil no salen de aquí: se dejan apuntados y los manda
        # el último paso, cuando los datos ya están publicados.
        env:
          # Los avisos se apuntan aquí y se mandan al final, solo si se publica
          AVISOS_A_ARCHIVO: avisos-pendientes.json
        run: |
          node scripts/rfaf/sincronizar.mjs \
            ${{ inputs.completo && '--completo' || '' }} \
            | tee salida.txt

      - name: Resumen
        if: always()
        run: |
          {
            echo '### Sincronización con la RFAF'
            echo '```'
            cat salida.txt 2>/dev/null || echo 'sin salida'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar cambios
        id: publicar
        # Cada publicación reconstruye y redespliega la web entera, así que
        # solo se publica cuando hay algo que enseñar.
        #
        # Y casi nunca lo había: los archivos llevan dentro la hora en que se
        # comprobaron, así que cada pasada los dejaba "cambiados" aunque el
        # fútbol fuera exactamente el mismo. Un sábado son treinta despliegues
        # de los que la mitad no cambian ni una cifra. Peor todavía: la web
        # avisa de "datos nuevos" comparando esa marca, así que a quien tuviera
        # el móvil abierto siguiendo el partido se le ofrecía recargar cada
        # veinte minutos para no ver nada distinto.
        #
        # Cuando sí hay algo que publicar, las marcas van con ello: entonces sí
        # dicen la verdad, que es cuándo cambiaron los datos.
        run: |
          if [ -z "$(git status --porcelain src/data/rfaf)" ]; then
            echo "Sin cambios en los datos de competición."
            exit 0
          fi

          # Un archivo nuevo (un equipo que aparece) siempre es noticia
          nuevos="$(git ls-files --others --exclude-standard -- src/data/rfaf | head -n 1)"

          # Y del resto, todo lo que no sea una marca de tiempo
          sustancia="$(git diff -U0 -- src/data/rfaf \
            | grep -E '^[+-]' \
            | grep -vE '^(\+\+\+|---)' \
            | grep -vE '"(actualizado|generado|comprobado)":' \
            | head -n 1)"

          if [ -z "$nuevos" ] && [ -z "$sustancia" ]; then
            echo "Solo han cambiado las marcas de tiempo: no se publica nada."
            git checkout -- src/data/rfaf
            exit 0
          fi

          git config user.name  "Sincronización RFAF"
          git config user.email "actions@github.com"
          git add src/data/rfaf
          git commit -m "Datos de competición actualizados desde la RFAF"

          # El panel también commitea a main, y una pasada que espera al cupo
          # de la RFAF dura cinco minutos: da tiempo a que llegue otro commit.
          # Pasó el 31 de agosto y el 3 y el 10 de septiembre de 2026, y esas
          # pasadas se perdieron. Se integra lo que haya y se reintenta.
          for intento in 1 2 3; do
            if ! git pull --rebase; then
              git rebase --abort || true
              echo "No se ha podido integrar main: se reintenta en la próxima pasada."
              exit 1
            fi
            if git push; then
              echo "publicado=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "El push ha vuelto a chocar (intento $intento)."
          done
          exit 1

      - name: Apuntar en el historial del club
        # Para que en /panel/logs se vea lo que publica el bot, no solo lo que
        # hace el club. Nunca hace fallar la pasada.
        if: always()
        continue-on-error: true
        env:
          AVISOS_SECRETO: ${{ secrets.AVISOS_SECRETO }}
          SITIO_URL: https://ad-taraguilla.es
        run: |
          avisos=0
          if [ -f avisos-pendientes.json ]; then
            avisos="$(grep -o '"titulo"' avisos-pendientes.json | wc -l | tr -d ' ')"
          fi

          if [ "${{ job.status }}" = "failure" ]; then
            node scripts/rfaf/apuntar.mjs --fallo "La sincronización ha fallado" "Mira la pasada en GitHub Actions"
          elif [ "${{ steps.publicar.outputs.publicado }}" = "true" ]; then
            node scripts/rfaf/apuntar.mjs "Datos publicados desde la RFAF" "$avisos novedad(es) para avisar"
          fi

      - name: Mandar avisos
        # Solo con los datos ya publicados. Antes salían antes del push: si este
        # fallaba, se avisaba de un resultado que no estaba en la web, y la
        # pasada siguiente, al encontrar la misma novedad, lo avisaba otra vez.
        if: steps.publicar.outputs.publicado == 'true'
        env:
          AVISOS_SECRETO: ${{ secrets.AVISOS_SECRETO }}
          SITIO_URL: https://ad-taraguilla.es
        run: node scripts/rfaf/avisar.mjs avisos-pendientes.json
